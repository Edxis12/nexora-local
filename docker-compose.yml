services:
  nexora_postgres:
    image: postgres:16-alpine
    container_name: nexora_postgres
    restart: always
    environment:
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_password_2026
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  nexora_pgdata: